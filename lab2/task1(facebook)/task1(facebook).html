<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Login</title>
    <link rel="stylesheet" href="task1(facebool).css">
 <!-- CSS файлы дұрыс қосылғанын тексеріңіз -->
</head>
<body>
    <div class="facebook-page">
        <div class="container">
            <div class="textbox">
                <h1 class="logo">facebook</h1>
                <p>Facebook helps you connect and share with the people in your life.</p> 
            </div>
            <div class="login"> 
                <form action="">
                    <input type="text" placeholder="Email or Phone Number" required><br>
                    <input type="password" placeholder="Password" required><br>
                    <button class="login-button">Log in</button> <!-- Жаңа button классы қолданылды -->
                    <a href="#">Forgotten password?</a><br>
                    <hr/>
                    <button class="create-account">Create New Account</button>
                </form>
                <p><span>Create a Page </span>for a celebrity, brand or business.</p>
            </div>
        </div>
    </div>
</body>
</html>
