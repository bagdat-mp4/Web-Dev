<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; padding: 20px; max-width: 1200px; margin: 0 auto;">
  @for (item of products(); track item.id) {
    <app-product-item 
      [product]="item" 
      (remove)="onRemove(item.id)">
    </app-product-item>
  } @empty {
    <div style="grid-column: 1 / -1; text-align: center; padding: 50px;">
      <h3 style="color: #999;">Бұл категорияда тауар қалмады 😢</h3>
    </div>
  }
</div>
