<div class="product-card">
  <div class="image-container">
    <img [src]="currentImage" [alt]="product().name" class="main-img">
  </div>
  
  <div class="gallery">
    @for (img of product().images; track img) {
      <img 
        [src]="img" 
        (click)="changeImage(img)" 
        class="thumbnail" 
        [class.active]="img === currentImage"
        alt="thumbnail">
    }
  </div>

  <div class="product-info">
    <h3 class="product-title">{{ product().name }}</h3>
    
    <div class="rating-container">
        <span class="stars">⭐⭐⭐⭐⭐</span> 
        <span class="rating-text">{{ product().rating }} / 5</span>
    </div>

    <h3 class="price">{{ product().price | number }} ₸</h3>
    <p class="likes-count">❤️ {{ product().likes }} лайк</p>
    
    <p class="description">{{ product().description }}</p>
    
    <div class="actions">
      <a [href]="product().link" target="_blank" class="btn kaspi-btn">Kaspi-де көру</a>
      
      <div class="button-row">
        <button (click)="like()" class="btn like-btn">👍 Лайк</button>
        <button (click)="delete()" class="btn delete-btn">🗑️ Өшіру</button>
      </div>

      <div class="button-row">
        <button (click)="shareWhatsApp()" class="btn wa-btn">WhatsApp</button>
        <button (click)="shareTelegram()" class="btn tg-btn">Telegram</button>
      </div>
    </div>
  </div>
</div>
