<div class="album-photos">
  <a [routerLink]="['/albums', albumId]" class="back-link">← Back to Album</a>
  <h2>Photos</h2>

  @if (loading) {
    <p class="loading">Loading photos...</p>
  } @else {
    <div class="photo-grid">
      @for (photo of photos; track photo.id) {
        <div class="photo-card">
          <img [src]="'https://picsum.photos/seed/' + photo.id + '/150/150'" [alt]="photo.title" loading="lazy" />
          <p class="photo-title">{{ photo.title }}</p>
        </div>
      }
    </div>
  }
</div>
