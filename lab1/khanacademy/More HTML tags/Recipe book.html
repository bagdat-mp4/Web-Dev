<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Project: Recipe book</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                background-color: #fff8e1;
            }

            h1 {
                color: #bf360c;
                text-align: center;
            }

            h2 {
                color: #e65100;
            }

            table {
                border-collapse: collapse;

            th, td {

            th {

            }

                padding: 10px;
                width: 200px;
            }

    <body>

        <h1>Bagdat's Recipe Book</h1>

        <h2>Contents:</h2>
        <ol>
            <li><a href="#pasta">Pasta Recipe</a></li>

        <table>
            <thead>
                <tr>
                    <th>Ingredients</th>
                    <th>Quantity</th>
                </tr>

            <tbody>
                <tr><td>Pasta</td><td>200 g</td></tr>
                <tr><td>Tomato sauce</td><td>1 cup</td></tr>
                <tr><td>Cheese</td><td>50 g</td></tr>

        </table>

        <p><strong>Step 1:</strong> Boil pasta.</p>
        <p><strong>Step 2:</strong> Add sauce.</p>

        <p>
